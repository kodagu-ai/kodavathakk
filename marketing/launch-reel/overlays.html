<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@600;700;800&family=Noto+Serif+Kannada:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon:#6E1E2A; --maroon-deep:#4A1119; --gold:#C9A227;
    --gold-soft:#E3C878; --ivory:#F7F1E5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: transparent; }

  /* Each card is a 1080x1920 transparent frame; type sits in the lower third
     so the film's focal point (center) stays clear. */
  .card {
    width:1080px; height:1920px;
    position:relative;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding: 0 90px 420px;
    text-align:center;
  }
  .line {
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:86px;
    line-height:1.14;
    color:var(--ivory);
    text-shadow: 0 4px 40px rgba(0,0,0,0.75), 0 2px 12px rgba(0,0,0,0.6);
  }
  .line .gold { color: var(--gold-soft); }
  .kn {
    font-family:'Noto Serif Kannada', serif;
    font-weight:700;
    font-size:104px;
    color:var(--gold-soft);
    text-shadow: 0 4px 40px rgba(0,0,0,0.8);
  }
  /* Gold rule under the type */
  .rule { width:120px; height:5px; background:var(--gold); border-radius:3px; margin-top:34px; }

  /* End card — fully opaque maroon */
  .endcard {
    width:1080px; height:1920px;
    background:var(--maroon);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    position:relative; overflow:hidden;
  }
  .endcard img { width:420px; margin-bottom:56px; }
  .endcard .kannada { font-family:'Noto Serif Kannada',serif; font-size:56px; color:var(--gold-soft); font-weight:700; margin-bottom:14px; }
  .endcard .wordmark {
    font-family:'Cormorant Garamond',serif; font-weight:700;
    font-size:82px; letter-spacing:0.14em; color:var(--ivory); margin-bottom:34px;
  }
  .endcard .rule { margin:0 0 40px; }
  .endcard .cta {
    font-family:'Manrope',sans-serif; font-weight:800; font-size:52px;
    color:var(--ivory); margin-bottom:18px;
  }
  .endcard .url {
    font-family:'Manrope',sans-serif; font-weight:700; font-size:44px;
    color:var(--gold-soft); letter-spacing:0.02em;
  }
  .endcard .foot {
    position:absolute; bottom:150px; left:0; right:0;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:26px;
    letter-spacing:0.28em; text-transform:uppercase; color:rgba(247,241,229,0.55);
  }
  .arcs { position:absolute; opacity:0.14; pointer-events:none; }
</style>
</head>
<body>

<div class="card" id="t1">
  <div class="line">Our language<br>has no script.</div>
  <div class="rule"></div>
</div>

<div class="card" id="t2">
  <div class="line">It lives in <span class="gold">the voice.</span></div>
  <div class="rule"></div>
</div>

<div class="card" id="t3">
  <div class="line">Every elder is<br>a living archive.</div>
  <div class="rule"></div>
</div>

<div class="card" id="t4">
  <div class="line">Today, we begin<br>recording — <span class="gold">together.</span></div>
  <div class="rule"></div>
</div>

<div class="card" id="t5">
  <div class="kn">ಕೊಡವ ತಕ್ಕ್</div>
  <div class="rule"></div>
</div>

<div class="endcard" id="end">
  <svg class="arcs" style="top:-160px; right:-160px; width:620px;" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="60" fill="none" stroke="#C9A227" stroke-width="1.6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#C9A227" stroke-width="1.3"/>
    <circle cx="100" cy="100" r="96" fill="none" stroke="#C9A227" stroke-width="1"/>
  </svg>
  <img src="ref/kodava-thakk-logo-reversed.svg" alt="">
  <div class="kannada">ಕೊಡವ ತಕ್ಕ್</div>
  <div class="wordmark">KODAVA THAKK</div>
  <div class="rule"></div>
  <div class="cta">Give your voice</div>
  <div class="url">kodavathakk.kodagu.ai</div>
  <div class="foot">A Kodagu.ai project</div>
</div>

</body>
</html>
